name: Bench Runner Probe

# Benchmark-only: records what hardware each runner label actually provides, so the
# CI timings can be read against it. Lives on the bench/* branches of the fork only.
on:
  push:
    branches:
      - bench/probe

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - avrea-ubuntu-latest-2-vcpu
          - avrea-ubuntu-latest-4-vcpu
    steps:
      - name: Hardware
        run: |
          echo "nproc=$(nproc)"
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread\(s\)|L3 cache' || true
          free -h | sed -n 2p
          df -h / | tail -1
          uname -r
          . /etc/os-release && echo "$PRETTY_NAME"
          echo "ImageOS=${ImageOS:-unset} ImageVersion=${ImageVersion:-unset}"

      - name: Toolchain
        run: |
          node --version
          npm --version
          docker --version
          docker buildx version

      - name: CPU single thread (sha256, 3s)
        run: openssl speed -seconds 3 -evp sha256 2>/dev/null | tail -1

      - name: CPU all threads (sha256, 3s)
        run: openssl speed -seconds 3 -multi "$(nproc)" -evp sha256 2>/dev/null | tail -1

      - name: Disk sequential write and read (2 GiB, direct)
        run: |
          dd if=/dev/zero of=bench.bin bs=1M count=2048 oflag=direct 2>&1 | tail -1
          dd if=bench.bin of=/dev/null bs=1M iflag=direct 2>&1 | tail -1
          rm -f bench.bin

      - name: Network (npm registry tarball)
        run: |
          curl -sS -o /dev/null \
            -w 'time_total=%{time_total}s speed=%{speed_download}B/s\n' \
            https://registry.npmjs.org/typescript/-/typescript-5.6.3.tgz
